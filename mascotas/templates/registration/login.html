{% extends "base.html" %}
{% block titulo %}Iniciar sesion{% endblock %}

{% block contenido %}
<div class="caja">
  <h1>Iniciar sesion</h1>
  {% if form.errors %}<p style="color:red">Usuario o contrasena incorrectos.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
