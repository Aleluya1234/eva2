{% extends "base.html" %}
{% block titulo %}Borrar{% endblock %}

{% block contenido %}
<div class="caja">
  <h1>Borrar {{ object.nombre }}?</h1>
  <p>Esta accion no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn borrar" type="submit">Si, borrar</button>
    <a href="{% url 'mascota_detail' object.pk %}">Cancelar</a>
  </form>
</div>
{% endblock %}
