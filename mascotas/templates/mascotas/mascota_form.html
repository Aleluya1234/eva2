{% extends "base.html" %}
{% block titulo %}{% if object %}Editar{% else %}Nueva mascota{% endif %}{% endblock %}

{% block contenido %}
<div class="caja">
  <h1>{% if object %}Editar {{ object.nombre }}{% else %}Nueva mascota{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
      <button class="btn" type="submit">Guardar</button>
      <a href="{% url 'mascota_list' %}">Cancelar</a>
    </p>
  </form>
</div>
{% endblock %}
